<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MUSEUM DEPARTMENT</title>
  <style>
    :root {
      --bg-body: #FFFFFF;
      --text-main: #000000;
      --text-muted: #888888;
      /* 大图模式的极简深色玻璃 */
      --bg-glass-dark: rgba(20, 20, 20, 0.7);
      --font-main: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-main);
      background: var(--bg-body);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      /* 底部留出悬浮栏的空间 */
      padding-bottom: 120px; 
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #E0E0E0; border-radius: 4px; }

    /* ========= 极简画廊区域 ========= */
    .gallery-scroll { padding: 60px 5vw 40px 5vw; }
    
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 60px 40px;
    }
    
    .gallery-item { cursor: pointer; display: flex; flex-direction: column; }
    
    .gallery-item img {
      width: 100%; height: auto; display: block;
      transition: opacity 0.4s ease;
      background: #f5f5f5;
      aspect-ratio: 3/4;
      object-fit: cover;
    }
    
    .gallery-item:hover img { opacity: 0.7; }

    .item-info { margin-top: 20px; }
    .item-name {
      font-size: 12px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; margin-bottom: 6px;
    }
    .item-sub { font-size: 11px; color: var(--text-muted); letter-spacing: 0.5px; }

    /* ========= 大图预览 ========= */
    .lightbox {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000000;
      z-index: 1000; display: flex; flex-direction: column;
      opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
    }
    
    .lightbox.active { opacity: 1; pointer-events: auto; }

    .lb-main-area {
      position: absolute;
      top: 0; bottom: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 40px 120px 40px;
      pointer-events: none;
    }

    .lb-img-container {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    
    .lb-img-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      pointer-events: auto;
      /* 去掉厚重的阴影，完全融入黑色背景 */
      box-shadow: none; 
    }

    /* ========= 统一底部悬浮状态栏 (极简版) ========= */
    .shared-bottom-bar {
      position: fixed;
      bottom: 40px; left: 0; right: 0;
      display: flex;
      justify-content: center;
      z-index: 1100;
      pointer-events: none;
    }

    .bottom-pill {
      pointer-events: auto;
      display: flex;
      align-items: center;
      /* 默认在白色背景下的样式 */
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 40px;
      padding: 8px 12px 8px 24px;
      border: none; /* 去掉边框 */
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08); /* 只保留极轻柔的阴影 */
      gap: 30px;
      min-width: 480px;
      justify-content: space-between;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 左侧文本 */
    .bar-title {
      color: #000;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      transition: color 0.3s;
    }

    /* 右侧内容区 */
    .bar-content {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* --- 首页模式：分类按钮 --- */
    .home-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .segment-btn {
      background: transparent;
      border: none;
      color: #666;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
      padding: 8px 16px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
    }
    
    .segment-btn:hover { color: #000; }
    
    .segment-btn.active {
      color: #000;
      font-weight: 600;
      background: rgba(0, 0, 0, 0.05); /* 极淡的背景色替代高亮蓝 */
    }

    /* --- 大图模式：翻页与关闭 --- */
    .lightbox-nav {
      display: none;
      align-items: center;
      gap: 20px;
    }
    
    .nav-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .arrow-btn {
      background: transparent; border: none; color: #FFF;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: opacity 0.2s;
      opacity: 0.6;
    }
    
    .arrow-btn:hover { opacity: 1; }
    .arrow-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; }
    
    .counter {
      color: #FFF; font-size: 12px; font-weight: 400;
      letter-spacing: 1px;
      min-width: 50px; text-align: center;
      opacity: 0.8;
    }
    
    .close-btn {
      background: transparent; border: none;
      color: #FFF; font-size: 12px; font-weight: 500;
      letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; transition: opacity 0.2s;
      padding: 8px 12px;
      opacity: 0.6;
    }
    
    .close-btn:hover { opacity: 1; }

    /* ★ 状态切换：大图模式下的极简深色化 ★ */
    body.lightbox-open .home-nav { display: none; }
    body.lightbox-open .lightbox-nav { display: flex; }
    
    /* 悬浮栏变色、透明 */
    body.lightbox-open .bottom-pill {
      background: var(--bg-glass-dark);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }
    
    /* 文字颜色反转 */
    body.lightbox-open .bar-title {
      color: #FFF;
      cursor: default;
    }

    /* ========= 移动端适配 ========= */
    @media (max-width: 768px) {
      .gallery-scroll { padding: 40px 20px 40px 20px; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 30px 15px; }
      
      .shared-bottom-bar { bottom: 20px; padding: 0 10px; }
      .bottom-pill {
        min-width: auto;
        width: 100%;
        max-width: 95vw;
        padding: 6px 6px 6px 20px;
        gap: 10px;
      }
      
      .bar-title { font-size: 11px; letter-spacing: 1px; }
      .segment-btn { padding: 6px 10px; font-size: 11px; }
      
      .lb-main-area { padding: 20px 20px 100px 20px; }
      
      .counter { min-width: 40px; font-size: 11px; }
      .close-btn { font-size: 11px; padding: 6px 8px; }
      .arrow-btn { width: 28px; height: 28px; }
    }
  </style>
</head>
<body>

  <!-- 主画廊区域 -->
  <main class="gallery-scroll">
    <div class="gallery-grid" id="gallery-grid"></div>
  </main>

  <!-- 大图查看器 -->
  <div class="lightbox" id="lightbox">
    <div class="lb-main-area">
      <div class="lb-img-container">
        <img id="lightbox-img" src="" alt="">
      </div>
    </div>
  </div>

  <!-- ★ 统一底部悬浮栏（极简版） ★ -->
  <div class="shared-bottom-bar">
    <div class="bottom-pill">
      <!-- 左侧标题 -->
      <div class="bar-title" id="bar-title" onclick="goHome()">MUSEUM DEPARTMENT</div>
      
      <!-- 右侧内容 -->
      <div class="bar-content">
        <!-- 1. 首页模式：分类切换 -->
        <div class="home-nav">
          <button class="segment-btn active" data-cat="all" onclick="switchCategory(this, 'all')">全部</button>
          <button class="segment-btn" data-cat="fix" onclick="switchCategory(this, 'fix')">修正指令</button>
          <button class="segment-btn" data-cat="about" onclick="switchCategory(this, 'about')">关于系统</button>
          <button class="segment-btn" data-cat="tops" onclick="switchCategory(this, 'tops')">上装</button>
        </div>

        <!-- 2. 大图模式：翻页与关闭 -->
        <div class="lightbox-nav">
          <div class="nav-group">
            <button class="arrow-btn" onclick="prevImage()">
              <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="counter" id="lb-counter">01 / 08</div>
            <button class="arrow-btn" onclick="nextImage()">
              <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
          <button class="close-btn" onclick="closeLightbox()">Close</button>
        </div>
      </div>
    </div>
  </div>

<script>
  /* ========= 数据 ========= */
  const confirmedData = [
    { folder: 'etro',          name: 'etro',         file: '01.JPG' },
    { folder: 'demobaza',      name: 'demobaza',     file: '01.webp' },
    { folder: 'heos',          name: 'heos',         file: '01.png' },
    { folder: 'parsons-bfa',   name: 'parsons bfa',  file: '01.JPG' },
    { folder: 'hermes',        name: 'Hermès',       file: '01.JPG' },
    { folder: 'saint-laurent', name: 'saint laurent',file: '01.JPG' },
    { folder: 'saint-laurent', name: 'saint laurent',file: '02.JPG' },
    { folder: 'saint-laurent', name: 'saint laurent',file: '03.JPG' }
  ];

  const CATEGORY_DATA = {
    all:   confirmedData, 
    fix:   confirmedData.slice(0, 4),
    about: confirmedData.slice(0, 2),
    tops:  confirmedData.slice(4, 8)
  };

  const grid        = document.getElementById('gallery-grid');
  const lightbox    = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const barTitle    = document.getElementById('bar-title');
  const lbCounter   = document.getElementById('lb-counter');
  const bodyEl      = document.body;

  let currentIndex = 0;
  let currentGalleryData = [];

  /* ========= 渲染网格 ========= */
  function renderGallery(images) {
    grid.innerHTML = '';
    currentGalleryData = images;

    images.forEach((item, index) => {
      const el = document.createElement('div');
      el.className = 'gallery-item';
      const imgSrc = `./images/${item.folder}/${item.file}`;
      el.innerHTML = `
        <img src="${imgSrc}" loading="lazy" alt="${item.name}"
             onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600&auto=format&fit=crop'">
        <div class="item-info">
          <div class="item-name">${item.name.toUpperCase()}</div>
          <div class="item-sub">IDX.${(index + 1).toString().padStart(2, '0')}</div>
        </div>
      `;
      el.addEventListener('click', () => openLightbox(index));
      grid.appendChild(el);
    });
  }

  /* ========= 打开与更新大图 ========= */
  function openLightbox(index) {
    currentIndex = index;
    lightbox.classList.add('active');
    bodyEl.style.overflow = 'hidden';
    bodyEl.classList.add('lightbox-open'); 
    
    updateLightboxContent();
  }

  function updateLightboxContent() {
    const item = currentGalleryData[currentIndex];
    const imgSrc = `./images/${item.folder}/${item.file}`;
    
    lightboxImg.src = imgSrc;
    lightboxImg.onerror = function() {
      this.src = 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1600&auto=format&fit=crop';
    };

    barTitle.textContent = item.name;
    lbCounter.textContent = `${(currentIndex + 1).toString().padStart(2, '0')} / ${currentGalleryData.length.toString().padStart(2, '0')}`;
  }

  function prevImage() { if (currentIndex > 0) { currentIndex--; updateLightboxContent(); } }
  function nextImage() { if (currentIndex < currentGalleryData.length - 1) { currentIndex++; updateLightboxContent(); } }

  /* ========= 关闭大图 ========= */
  function closeLightbox() {
    lightbox.classList.remove('active');
    bodyEl.style.overflow = '';
    bodyEl.classList.remove('lightbox-open');
    
    // 恢复底栏左侧默认文字
    barTitle.textContent = 'MUSEUM DEPARTMENT';
  }

  /* ========= 分类切换 ========= */
  function switchCategory(btn, cat) {
    document.querySelectorAll('.segment-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');

    const data = CATEGORY_DATA[cat] || CATEGORY_DATA.all;
    renderGallery(data);
    closeLightbox();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function goHome() {
    if(bodyEl.classList.contains('lightbox-open')) return; 
    const allBtn = document.querySelector('.segment-btn[data-cat="all"]');
    switchCategory(allBtn, 'all');
  }

  /* ========= 键盘控制 ========= */
  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('active')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') prevImage();
    if (e.key === 'ArrowRight') nextImage();
  });

  /* ========= 初始化 ========= */
  document.addEventListener('DOMContentLoaded', () => {
    renderGallery(CATEGORY_DATA.all);
  });
</script>
</body>
</html>
