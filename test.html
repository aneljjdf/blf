<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Babel · 异常档案终端</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Share+Tech+Mono&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  /* 提取自截图的高级档案配色 */
  --bg-dark: #1c221f;
  --paper: #e6eae7;
  --paper-dim: #cdd4cf;
  
  --text-main: #1a201d;
  --text-light: #93a49c;
  
  --accent-red: #a3454c;
  --accent-green: #3b5c52;
  --accent-teal: #628b82;
  
  --font-mono: "Share Tech Mono", "Courier New", monospace;
  --font-title: "Space Grotesk", "Noto Sans SC", sans-serif;
  --font-body: "Noto Sans SC", sans-serif;
}

body {
  background-color: var(--bg-dark);
  color: #fff;
  line-height: 1.7;
  font-family: var(--font-body);
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  padding: 40px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ===== 背景层 ===== */
#bg {
  position: fixed;
  inset: 0;
  z-index: -3;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-color: var(--bg-dark);
  transition: background-image 0.8s ease;
}

#bgMask {
  position: fixed;
  inset: 0;
  z-index: -2;
  /* 叠加一层灰绿和模糊，让背景彻底退居幕后 */
  backdrop-filter: blur(12px) brightness(0.6) sepia(0.3) hue-rotate(90deg);
  background: rgba(28, 34, 31, 0.7);
  pointer-events: none;
  transition: background 0.15s linear;
}

/* 深重暗角 */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  background: radial-gradient(circle at 50% 40%, transparent 20%, rgba(10, 14, 12, 0.85) 100%);
}

/* 全局网格特效 */
#fx-layer {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image: 
    linear-gradient(rgba(163, 69, 76, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(163, 69, 76, 0.04) 1px, transparent 1px);
  background-size: 40px 40px;
}

/* ===== 主界面排版 ===== */
.topbar {
  width: 100%;
  max-width: 1000px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 30px;
  position: relative;
  z-index: 20;
}

.title-group {
  display: flex;
  flex-direction: column;
  position: relative;
}

.title-group::before {
  content: '';
  position: absolute;
  left: -16px;
  top: 6px;
  bottom: 0;
  width: 3px;
  background: var(--accent-red);
}

.subtitle {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--accent-red);
  letter-spacing: 0.4em;
  margin-bottom: 8px;
  font-weight: 500;
}

.title {
  font-family: var(--font-title);
  font-size: 26px;
  font-weight: 900;
  color: #ffffff;
  outline: none;
  cursor: text;
  letter-spacing: 0.1em;
  text-shadow: 
    -2px 0 0 rgba(163, 69, 76, 0.6),
     2px 0 0 rgba(98, 139, 130, 0.6),
     0 4px 15px rgba(0, 0, 0, 0.8);
  transition: color 0.3s ease, text-shadow 0.3s ease;
}
.title:hover, .title:focus {
  text-shadow: 
    -3px 0 0 rgba(163, 69, 76, 0.9),
     3px 0 0 rgba(98, 139, 130, 0.9),
     0 4px 20px rgba(0, 0, 0, 0.9);
}

.btns {
  display: flex;
  gap: 12px;
}
.btns button {
  background: transparent;
  border: 1px dashed rgba(255, 255, 255, 0.4);
  font-family: var(--font-mono);
  font-size: 12px;
  color: #fff;
  cursor: pointer;
  padding: 8px 16px;
  transition: all 0.2s ease;
  letter-spacing: 0.1em;
}
.btns button:hover {
  background: rgba(255, 255, 255, 0.1);
  border-style: solid;
  border-color: var(--accent-red);
}

/* ===== 控制台面板 ===== */
.console-panel {
  width: 100%;
  max-width: 1000px;
  background: rgba(20, 26, 23, 0.65);
  border: 1px dashed rgba(163, 69, 76, 0.4);
  border-left: 4px solid var(--accent-red);
  padding: 16px 20px;
  margin-bottom: 40px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  backdrop-filter: blur(5px);
  position: relative;
  z-index: 20;
}
.console-panel::before, .console-panel::after {
  content: ''; position: absolute; width: 8px; height: 8px; pointer-events: none;
}
.console-panel::before {
  top: -1px; left: -1px; border-top: 2px solid var(--paper); border-left: 2px solid var(--paper);
}
.console-panel::after {
  bottom: -1px; right: -1px; border-bottom: 2px solid var(--paper); border-right: 2px solid var(--paper);
}

.panel-row {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.panel-label {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-light);
  letter-spacing: 0.15em;
  min-width: 84px;
}

.font-btn {
  background: transparent;
  border: 1px solid rgba(147, 164, 156, 0.3);
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--text-light);
  cursor: pointer;
  padding: 4px 14px;
  transition: all 0.2s ease;
}
.font-btn:hover {
  color: #fff;
  border-color: var(--paper);
}
.font-btn.active {
  background: var(--paper);
  color: var(--text-main);
  border-color: var(--paper);
  font-weight: 700;
}

.mask-control {
  display: flex;
  align-items: center;
  gap: 14px;
  flex: 1;
  min-width: 200px;
}
.mask-control input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  flex: 1;
  height: 2px;
  background: rgba(147, 164, 156, 0.3);
  outline: none;
  cursor: pointer;
}
.mask-control input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  background: var(--paper);
  cursor: pointer;
  border: 2px solid var(--accent-red);
  border-radius: 0;
}
.mask-control .value {
  font-family: var(--font-mono);
  font-size: 15px;
  color: var(--paper);
  font-weight: bold;
}

/* ===== 散落卡片 ===== */
.directory {
  width: 100%;
  max-width: 1000px;
  display: flex;
  flex-wrap: wrap;
  gap: 40px;
  justify-content: center;
  position: relative;
  z-index: 20;
}

.doc-row {
  width: 300px;
  height: 200px;
  background-color: var(--paper);
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  box-shadow: 10px 15px 30px rgba(0,0,0,0.8);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  position: relative;
  color: var(--text-main);
  border: 1px solid rgba(255, 255, 255, 0.2);
  
  /* 纸张纹理：淡淡的网格 */
  background-image: 
    linear-gradient(rgba(27, 46, 40, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(27, 46, 40, 0.04) 1px, transparent 1px);
  background-size: 20px 20px;
}

/* 随机倾斜 */
.doc-row:nth-child(1) { transform: rotate(-2deg); }
.doc-row:nth-child(2) { transform: rotate(3deg) translateY(20px); }
.doc-row:nth-child(3) { transform: rotate(-4deg) translateY(-10px); }
.doc-row:nth-child(4) { transform: rotate(2deg) translateY(15px); }

.doc-row:hover {
  transform: scale(1.05) rotate(0deg) translateY(0) !important;
  box-shadow: 0 20px 50px rgba(0,0,0,0.9);
  z-index: 30;
}

.doc-header {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  border-bottom: 1px dashed rgba(26, 32, 29, 0.3);
  padding-bottom: 8px;
  display: flex;
  justify-content: space-between;
  font-weight: bold;
}

.doc-content {
  text-align: center;
  font-family: var(--font-title);
  font-size: 28px;
  font-weight: 700;
  color: var(--text-main);
}
.doc-content .subtext {
  display: block;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: normal;
  color: var(--accent-red);
  margin-top: 8px;
}

/* =========================================
   模态框 (彻底融合第二份代码的窗口质感)
========================================= */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 14, 12, 0.85);
  z-index: 100;
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.modal-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.modal-paper {
  width: 90vw;
  max-width: 720px;
  /* 核心修改：高度自适应，但最高不超过 65vh，看起来紧凑 */
  max-height: 65vh;
  background: var(--paper);
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 101;
  
  /* 用多重阴影和边框制造纸张的厚度与叠层感 */
  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: 
    0 30px 80px rgba(0, 0, 0, 0.95),
    inset 0 0 0 4px var(--paper),
    inset 0 0 0 5px rgba(163, 69, 76, 0.3);
    
  transform: translateY(20px) scale(0.95);
  transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.modal-overlay.show .modal-paper {
  transform: translateY(0) scale(1);
}

/* 纸张纹理：淡淡的网格 */
.modal-paper::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image: 
    linear-gradient(rgba(27, 46, 40, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(27, 46, 40, 0.04) 1px, transparent 1px);
  background-size: 20px 20px;
  z-index: 0;
}

/* 伪元素制造右侧的「虚化印章」感 */
.modal-paper::after {
  content: 'BABEL ARCHIVE';
  position: absolute;
  right: -5px;
  top: 50px;
  font-family: var(--font-mono);
  font-size: 30px;
  color: rgba(163, 69, 76, 0.06);
  transform: rotate(90deg);
  pointer-events: none;
  z-index: 0;
  letter-spacing: 5px;
}

/* 窗口头部 */
.modal-header {
  background: var(--accent-green);
  color: var(--paper);
  padding: 10px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 14px;
  border-bottom: 2px solid var(--accent-red);
  position: relative;
  z-index: 1;
  letter-spacing: 0.05em;
}

/* 窗口右上角按钮 */
.header-controls {
  display: flex;
  gap: 6px;
}
.header-controls span {
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 1px solid var(--paper);
  background: transparent;
  line-height: 16px;
  text-align: center;
  font-size: 11px;
  cursor: default;
  color: var(--paper);
}
.header-controls span.close {
  background: var(--accent-red);
  border-color: var(--accent-red);
  color: #fff;
  cursor: pointer;
  transition: opacity 0.2s;
}
.header-controls span.close:hover { opacity: 0.8; }

/* 输入区：自适应高度，内部滚动 */
.modal-textarea {
  width: 100%;
  min-height: 200px;
  border: none;
  outline: none;
  background: transparent;
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 16px;
  line-height: 2;
  letter-spacing: 0.05em;
  color: var(--text-main);
  caret-color: var(--accent-red);
  resize: none;
  padding: 20px 30px;
  position: relative;
  z-index: 1;
  overflow-y: auto;
}

.modal-textarea::placeholder {
  color: rgba(26, 32, 29, 0.35);
  font-style: italic;
}

/* 字体切换 */
body.font-default .modal-textarea { font-family: var(--font-body); font-weight: 500; }
body.font-apple .modal-textarea { font-family: -apple-system, sans-serif; font-weight: 400; letter-spacing: 0; }
body.font-korean .modal-textarea { font-family: "Noto Sans KR", "Noto Sans SC", sans-serif; font-weight: 400; letter-spacing: 0.02em; }

/* 窗口底部 */
.modal-footer {
  border-top: 1px dashed rgba(26, 32, 29, 0.3);
  padding: 10px 20px;
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--accent-green);
  position: relative;
  z-index: 1;
}

/* ===== 保存提示 ===== */
#saved {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.1em;
  color: #fff;
  background: var(--accent-green);
  padding: 8px 20px;
  border: 1px dashed var(--paper);
  box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
  opacity: 0;
  transition: opacity 0.3s ease, transform 0.3s ease;
  pointer-events: none;
  z-index: 200;
}
#saved.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@media (max-width: 680px) {
  body { padding: 20px 10px; }
  .title { font-size: 24px; }
  .topbar { flex-direction: column; gap: 16px; }
  .title-group::before { display: none; }
  .doc-row { width: 100%; max-width: 320px; height: 180px; }
  .modal-paper { max-height: 75vh; width: 95vw; }
  .modal-textarea { padding: 20px; }
}
</style>
</head>
<body class="font-default">

<div id="bg"></div>
<div id="bgMask"></div>
<div id="fx-layer"></div>

<div class="topbar">
  <div class="title-group">
    <div class="subtitle">BABEL ARCHIVE // SEC-01</div>
    <div class="title" id="title" contenteditable="true" spellcheck="false">巴别塔异常收容档案</div>
  </div>
  <div class="btns">
    <button id="btnUpload">载入背景</button>
    <button id="btnClearBg">清空背景</button>
  </div>
</div>

<!-- 控制台面板 -->
<div class="console-panel">
  <div class="panel-row">
    <span class="panel-label">[ 字体渲染 ]</span>
    <button class="font-btn active" data-font="default">标准档案</button>
    <button class="font-btn" data-font="apple">极简无衬线</button>
    <button class="font-btn" data-font="korean">韩系排版</button>
  </div>
  <div class="panel-row">
    <span class="panel-label">[ 背景遮罩 ]</span>
    <div class="mask-control">
      <input type="range" id="maskRange" min="0" max="100" value="70">
      <span class="value" id="maskValue">70</span>
    </div>
  </div>
</div>

<!-- 卡片列表 -->
<div class="directory">
  <div class="doc-row" data-id="editor-1">
    <div class="doc-header">
      <span>Ver 1.0 // 已归档</span>
    </div>
    <div class="doc-content">
      Completed_
      <span class="subtext">点击展开记录</span>
    </div>
  </div>
  
  <div class="doc-row" data-id="editor-2">
    <div class="doc-header">
      <span>Ver 2.0 // 观察中</span>
    </div>
    <div class="doc-content">
      Completed_
      <span class="subtext">点击展开记录</span>
    </div>
  </div>

  <div class="doc-row" data-id="editor-3">
    <div class="doc-header">
      <span>SEC-03 // 封锁</span>
    </div>
    <div class="doc-content">
      Locked_
      <span class="subtext">前置关卡未通关</span>
    </div>
  </div>

  <div class="doc-row" data-id="editor-4">
    <div class="doc-header">
      <span>SEC-04 // 封锁</span>
    </div>
    <div class="doc-content">
      Locked_
      <span class="subtext">1天后开启</span>
    </div>
  </div>
</div>

<!-- 模态框 (完美复刻终端窗口) -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-paper" id="modalPaper">
    <div class="modal-header">
      <span id="modalTitle">💾 VER 1.0 // 记录</span>
      <div class="header-controls">
        <span>_</span>
        <span>□</span>
        <span class="close" id="btnClose">×</span>
      </div>
    </div>
    
    <textarea class="modal-textarea" id="modalEditor" placeholder=">> 身份验证通过。请在此处输入您的异常观测日志..."></textarea>
    
    <div class="modal-footer">
      <span>AUTH: LEVEL-4</span>
      <span>UID: 101250822</span>
    </div>
  </div>
</div>

<div id="saved">[ 数据已同步 ]</div>
<input type="file" id="fileInput" accept="image/*" hidden>

<script>
/* ===== DOM ===== */
const bg = document.getElementById('bg');
const bgMask = document.getElementById('bgMask');
const fileInput = document.getElementById('fileInput');
const titleEl = document.getElementById('title');
const overlay = document.getElementById('modalOverlay');
const modalEditor = document.getElementById('modalEditor');
const modalTitle = document.getElementById('modalTitle');
const savedTip = document.getElementById('saved');
const docRows = document.querySelectorAll('.doc-row');
const btnClose = document.getElementById('btnClose');
const maskRange = document.getElementById('maskRange');
const maskValue = document.getElementById('maskValue');
const fontBtns = document.querySelectorAll('.font-btn');

const KEY_MASK = 'babel_mask_v15';
const KEY_TITLE = 'babel_title_v15';
const KEY_FONT = 'babel_font_v15';

let currentDocId = null;
let db;

function adjustHeight() {
  modalEditor.style.height = 'auto';
  modalEditor.style.height = Math.min(modalEditor.scrollHeight, window.innerHeight * 0.4) + 'px';
}

function applyMask(percent) {
  const alpha = percent / 100 * 0.95; 
  bgMask.style.background = `rgba(28, 34, 31, ${alpha})`;
  maskValue.textContent = percent;
}

function setFont(fontId) {
  document.body.classList.remove('font-apple', 'font-korean', 'font-default');
  document.body.classList.add('font-' + fontId);
  fontBtns.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.font === fontId);
  });
  localStorage.setItem(KEY_FONT, fontId);
  setTimeout(adjustHeight, 30);
}

/* ===== IndexedDB ===== */
const dbReq = indexedDB.open('BabelTerminalDB', 7);
dbReq.onupgradeneeded = (e) => {
  const db = e.target.result;
  if (!db.objectStoreNames.contains('images')) db.createObjectStore('images');
};
dbReq.onsuccess = (e) => {
  db = e.target.result;
  if (db) {
    const getReq = db.transaction('images', 'readonly').objectStore('images').get('bgImage');
    getReq.onsuccess = () => {
      if (getReq.result) bg.style.backgroundImage = `url(${getReq.result})`;
    };
  }
};

document.getElementById('btnUpload').addEventListener('click', () => fileInput.click());
document.getElementById('btnClearBg').addEventListener('click', () => {
  bg.style.backgroundImage = '';
  if(db) db.transaction('images', 'readwrite').objectStore('images').delete('bgImage');
});

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    bg.style.backgroundImage = `url(${e.target.result})`;
    if (db) db.transaction('images', 'readwrite').objectStore('images').put(e.target.result, 'bgImage');
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
});

/* ===== 列表与弹窗逻辑 ===== */
docRows.forEach(row => {
  const id = row.getAttribute('data-id');
  const title = row.querySelector('.doc-header').textContent.trim();

  if (localStorage.getItem(id)) {
    const subtext = row.querySelector('.subtext');
    if (subtext) {
      subtext.textContent = "已记录";
      subtext.style.color = "var(--accent-green)";
    }
  }

  row.addEventListener('click', (e) => {
    e.preventDefault();
    currentDocId = id;
    // 拼接头部的图标
    modalTitle.innerHTML = `💾 ${title}`;
    
    modalEditor.value = localStorage.getItem(id) || '';
    modalEditor.style.height = '200px';
    adjustHeight();

    overlay.classList.add('show');
    
    setTimeout(() => {
      modalEditor.focus();
      adjustHeight();
    }, 300);
  });
});

// 关闭按钮
btnClose.addEventListener('click', (e) => {
  e.stopPropagation();
  closeAndSave();
});

// 点击背景黑边关闭
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) {
    closeAndSave();
  }
});

function closeAndSave() {
  if (currentDocId && modalEditor.value.trim() !== '') {
    localStorage.setItem(currentDocId, modalEditor.value);
    showSaved();

    const row = document.querySelector(`.doc-row[data-id="${currentDocId}"]`);
    if (row) {
      const subtext = row.querySelector('.subtext');
      if (subtext) {
        subtext.textContent = "已记录";
        subtext.style.color = "var(--accent-green)";
      }
    }
  }
  overlay.classList.remove('show');
  currentDocId = null;
}

// 自动保存 & 高度自适应
let timer = null;
modalEditor.addEventListener('input', () => {
  adjustHeight();
  clearTimeout(timer);
  timer = setTimeout(() => {
    if (currentDocId) {
      localStorage.setItem(currentDocId, modalEditor.value);
      showSaved();
    }
  }, 800);
});

let savedTimer = null;
function showSaved() {
  savedTip.classList.add('show');
  clearTimeout(savedTimer);
  savedTimer = setTimeout(() => {
    savedTip.classList.remove('show');
  }, 1500);
}

/* 遮罩调节 */
maskRange.addEventListener('input', () => {
  const v = parseInt(maskRange.value, 10);
  applyMask(v);
  localStorage.setItem(KEY_MASK, v);
});

/* 字体切换 */
fontBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    setFont(btn.dataset.font);
  });
});

/* 标题保存 */
titleEl.addEventListener('input', () => {
  localStorage.setItem(KEY_TITLE, titleEl.textContent.trim());
});

/* 初始化 */
window.addEventListener('DOMContentLoaded', () => {
  const t = localStorage.getItem(KEY_TITLE);
  if (t) titleEl.textContent = t;

  const m = localStorage.getItem(KEY_MASK);
  const initMask = m !== null ? parseInt(m, 10) : 70;
  maskRange.value = initMask;
  applyMask(initMask);

  const savedFont = localStorage.getItem(KEY_FONT) || 'default';
  setFont(savedFont);
});
</script>

</body>
</html>
