<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Babel - 异常收容终端</title>

<!-- 引入等宽字体（打字机感）与粗黑体 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

/* ===== 巴别塔档案主题变量 ===== */
:root {
  --bg-dark: #0b0c0d;          /* 深渊黑 */
  --panel-bg: rgba(90, 118, 116, 0.95); /* 深海青灰底 */
  --panel-bg-dark: rgba(42, 55, 54, 0.95);
  --text-light: #e2e6e5;       /* 泛黄白 */
  --text-dark: #1a1c1c;        /* 纯黑 */
  --accent-red: #a3222b;       /* 警戒红 */
  --border-light: rgba(255,255,255,0.4);
  --font-mono: "Share Tech Mono", "Courier New", monospace;
  --font-title: "Noto Sans SC", sans-serif;
}

body {
  background-color: var(--bg-dark);
  color: var(--text-light);
  line-height: 1.8;
  font-family: var(--font-mono);
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* ===== 背景层 ===== */
#bg {
  position: fixed;
  inset: 0;
  z-index: -3;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-color: var(--bg-dark);
  filter: grayscale(40%) contrast(120%) brightness(0.6); /* 让背景图更暗更阴间 */
  transition: background-image 0.5s ease;
}

#bgMask {
  position: fixed;
  inset: 0;
  z-index: -2;
  background: rgba(11, 12, 13, 0.85);
  pointer-events: none;
  transition: background 0.1s linear;
}

/* ===== 新版网格与扫描线特效 ===== */
#fx-layer {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  /* 1. 细密的背景网格 */
  background-image: 
    linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
  background-size: 24px 24px; /* 网格大小 */
  background-position: center center;
}

/* 2. 屏幕扫描线（CRT显示器质感） */
#fx-layer::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.25) 50%);
  background-size: 100% 4px; /* 每4像素一条黑线 */
}

/* ===== 内容容器 ===== */
.page {
  max-width: 760px;
  margin: 0 auto;
  padding: 50px 24px 120px;
}

/* ===== 顶部控制区 ===== */
.topbar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 20px;
  flex-wrap: wrap;
}

.topbar .title-wrapper {
  display: flex;
  flex-direction: column;
}

.topbar .subtitle {
  font-size: 11px;
  color: var(--accent-red);
  letter-spacing: 0.2em;
  font-family: var(--font-mono);
  margin-bottom: 4px;
}

.topbar .title {
  font-family: var(--font-title);
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 0.1em;
  color: var(--text-light);
  outline: none;
  cursor: text;
  padding: 0;
  border-bottom: 2px solid transparent;
  transition: border-color 0.3s ease;
  min-width: 40px;
  text-shadow: 2px 2px 0 #000;
}

.topbar .title:hover { border-bottom-color: var(--accent-red); }
.topbar .title:focus { border-bottom-color: var(--accent-red); }
.topbar .title:empty::before { content: "未命名档案"; color: #666; }

.topbar .btns {
  display: flex;
  gap: 12px;
  flex-shrink: 0;
  padding-bottom: 4px;
}

.topbar button {
  background: var(--panel-bg-dark);
  border: 1px solid var(--border-light);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-light);
  cursor: pointer;
  padding: 6px 12px;
  transition: all 0.2s ease;
  text-transform: uppercase;
}

.topbar button:hover {
  background: var(--accent-red);
  border-color: var(--accent-red);
  color: #fff;
}

/* ===== 控制台 UI ===== */
.console-panel {
  background: var(--panel-bg);
  border: 1px solid var(--border-light);
  border-top: 4px solid var(--accent-red); 
  padding: 12px 16px;
  margin-bottom: 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 6px 6px 0 rgba(0,0,0,0.5); 
}

.panel-row {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.panel-label {
  font-size: 12px;
  color: var(--text-dark);
  font-weight: bold;
  letter-spacing: 0.1em;
  min-width: 60px;
}

.font-btn {
  background: transparent;
  border: 1px dashed rgba(0,0,0,0.4);
  font-family: var(--font-title);
  font-size: 12px;
  color: var(--text-dark);
  cursor: pointer;
  padding: 4px 10px;
  transition: all 0.2s ease;
}

.font-btn:hover {
  background: rgba(255,255,255,0.2);
}

.font-btn.active {
  background: var(--text-dark);
  color: var(--text-light);
  border-style: solid;
}

.mask-control {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
  min-width: 200px;
}

.mask-control input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  flex: 1;
  height: 6px;
  background: rgba(0,0,0,0.2);
  border: 1px solid rgba(0,0,0,0.3);
  outline: none;
  cursor: pointer;
}

.mask-control input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 20px;
  background: var(--accent-red);
  cursor: pointer;
  border: 1px solid #000;
  box-shadow: 2px 2px 0 rgba(0,0,0,0.5);
}

.mask-control .value {
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--text-dark);
  font-weight: bold;
  min-width: 30px;
  text-align: right;
}

/* ===== 巨大的主窗口 ===== */
.window-frame {
  background: var(--panel-bg);
  border: 2px solid var(--text-light);
  box-shadow: 8px 8px 0 rgba(0,0,0,0.6);
  display: flex;
  flex-direction: column;
}

.window-header {
  background: var(--text-light);
  color: var(--text-dark);
  padding: 6px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-title);
  font-weight: bold;
  font-size: 13px;
  border-bottom: 2px solid var(--text-dark);
}

.window-btns {
  display: flex;
  gap: 4px;
}
.window-btns span {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 1px solid var(--text-dark);
  background: transparent;
  line-height: 12px;
  text-align: center;
  font-size: 10px;
  cursor: pointer;
}
.window-btns span.close {
  background: var(--accent-red);
  color: #fff;
  border-color: var(--accent-red);
}

#editor {
  width: 100%;
  min-height: 55vh;
  border: none;
  outline: none;
  background: transparent;
  font-family: var(--font-title);
  font-size: 16px;
  font-weight: 700; 
  line-height: 2;
  letter-spacing: 0.05em;
  color: var(--text-dark);
  resize: none;
  padding: 24px;
  overflow: hidden;
  field-sizing: content;
}

#editor::placeholder {
  color: rgba(26, 28, 28, 0.4);
  font-style: italic;
}

/* 字体应用 */
body.font-default #editor { font-family: var(--font-title); font-weight: 700; }
body.font-apple #editor { font-family: -apple-system, sans-serif; font-weight: 500; letter-spacing: 0; }
body.font-korean #editor { font-family: "Noto Sans KR", sans-serif; font-weight: 400; letter-spacing: 0.02em; }

.window-footer {
  border-top: 2px dashed var(--border-light);
  padding: 10px 16px;
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dark);
}
.blink {
  animation: blink 1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ===== 保存提示 ===== */
#saved {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  font-family: var(--font-mono);
  font-size: 14px;
  letter-spacing: 0.1em;
  color: var(--text-light);
  background: var(--accent-red);
  padding: 8px 16px;
  border: 1px solid #fff;
  box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
  opacity: 0;
  transition: opacity 0.3s ease, transform 0.3s ease;
  pointer-events: none;
  z-index: 100;
}

#saved.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@media (max-width: 600px) {
  .page { padding: 30px 16px 100px; }
  .topbar .title { font-size: 20px; }
  #editor { font-size: 15px; padding: 16px; }
  .console-panel { padding: 10px; }
  .window-header { font-size: 12px; }
}
</style>
</head>
<body class="font-default">

<div id="bg"></div>
<div id="bgMask"></div>
<div id="fx-layer"></div> <!-- 这里改成了新的网格层 -->

<div class="page">

  <div class="topbar">
    <div class="title-wrapper">
      <div class="subtitle">BABEL ARCHIVE // SEC-01</div>
      <div class="title" id="title" contenteditable="true" spellcheck="false">巴别塔异常收容档案</div>
    </div>
    <div class="btns">
      <button id="btnUpload">载入环境图像</button>
      <button id="btnClearBg">清空环境</button>
    </div>
  </div>

  <div class="console-panel">
    <div class="panel-row">
      <span class="panel-label">[FONT]</span>
      <button class="font-btn active" data-font="default">标准档案体</button>
      <button class="font-btn" data-font="apple">极简无衬线</button>
      <button class="font-btn" data-font="korean">韩系排版</button>
    </div>
    <div class="panel-row">
      <span class="panel-label">[OPACITY]</span>
      <div class="mask-control">
        <input type="range" id="maskRange" min="20" max="100" value="85">
        <span class="value" id="maskValue">85</span>
      </div>
    </div>
  </div>

  <div class="window-frame">
    <div class="window-header">
      <span>📄 收容编号: Babel-001</span>
      <div class="window-btns">
        <span>_</span>
        <span>□</span>
        <span class="close">×</span>
      </div>
    </div>
    
    <textarea id="editor" placeholder="异常体外形描述已删除。状态符合人类健康标准，可通过身份认证。请在此输入观察日志……"></textarea>
    
    <div class="window-footer">
      <span>AUTH: LEVEL-4</span>
      <span>REC [<span class="blink">■</span>]</span>
    </div>
  </div>

</div>

<div id="saved">[ 数据已同步 ]</div>

<input type="file" id="fileInput" accept="image/*" hidden>

<script>
/* ===== DOM ===== */
const bg = document.getElementById('bg');
const bgMask = document.getElementById('bgMask');
const editor = document.getElementById('editor');
const savedTip = document.getElementById('saved');
const fileInput = document.getElementById('fileInput');
const maskRange = document.getElementById('maskRange');
const maskValue = document.getElementById('maskValue');
const titleEl = document.getElementById('title');
const fontBtns = document.querySelectorAll('.font-btn');

/* ===== 存储键名 ===== */
const KEY_TEXT = 'babel_text';
const KEY_MASK = 'babel_mask';
const KEY_TITLE = 'babel_title';
const KEY_FONT = 'babel_font';

/* ===== 自动增高 ===== */
function autoGrow() {
  editor.style.height = 'auto';
  editor.style.height = editor.scrollHeight + 'px';
}

/* ===== 应用遮罩 ===== */
function applyMask(percent) {
  const alpha = percent / 100;
  bgMask.style.background = `rgba(11, 12, 13, ${alpha})`;
  maskValue.textContent = percent;
}

/* ===== 切换字体 ===== */
function setFont(fontId) {
  document.body.classList.remove('font-apple', 'font-korean', 'font-default');
  document.body.classList.add('font-' + fontId);
  
  fontBtns.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.font === fontId);
  });
  
  localStorage.setItem(KEY_FONT, fontId);
  setTimeout(autoGrow, 30);
}

/* ==========================================
   IndexedDB 核心逻辑（无惧大图，替代 localStorage）
========================================== */
let db;
const dbReq = indexedDB.open('BabelTerminalDB_v2', 1); // 升级版本号
dbReq.onupgradeneeded = (e) => {
  const db = e.target.result;
  if (!db.objectStoreNames.contains('images')) {
    db.createObjectStore('images');
  }
};
dbReq.onsuccess = (e) => {
  db = e.target.result;
  if (db) {
    const tx = db.transaction('images', 'readonly');
    const store = tx.objectStore('images');
    const getReq = store.get('bgImage');
    getReq.onsuccess = () => {
      if (getReq.result) {
        bg.style.backgroundImage = `url(${getReq.result})`;
      }
    };
  }
};

function saveBgToDB(base64Str) {
  if (!db) return;
  const tx = db.transaction('images', 'readwrite');
  const store = tx.objectStore('images');
  store.put(base64Str, 'bgImage');
}

function clearBgFromDB() {
  if (!db) return;
  const tx = db.transaction('images', 'readwrite');
  const store = tx.objectStore('images');
  store.delete('bgImage');
}

/* ===== 初始化 ===== */
window.addEventListener('DOMContentLoaded', () => {
  const t = localStorage.getItem(KEY_TEXT);
  if (t) editor.value = t;

  const m = localStorage.getItem(KEY_MASK);
  const initMask = m !== null ? parseInt(m, 10) : 85;
  maskRange.value = initMask;
  applyMask(initMask);

  const ti = localStorage.getItem(KEY_TITLE);
  if (ti) titleEl.textContent = ti;

  const savedFont = localStorage.getItem(KEY_FONT) || 'default';
  setFont(savedFont);

  autoGrow();
});

/* ===== 交互事件 ===== */
maskRange.addEventListener('input', () => {
  const v = parseInt(maskRange.value, 10);
  applyMask(v);
  localStorage.setItem(KEY_MASK, v);
});

let titleTimer = null;
titleEl.addEventListener('input', () => {
  clearTimeout(titleTimer);
  titleTimer = setTimeout(() => {
    localStorage.setItem(KEY_TITLE, titleEl.textContent.trim());
    showSaved();
  }, 600);
});

titleEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    titleEl.blur();
  }
});

titleEl.addEventListener('blur', () => {
  localStorage.setItem(KEY_TITLE, titleEl.textContent.trim());
});

let textTimer = null;
editor.addEventListener('input', () => {
  autoGrow();
  clearTimeout(textTimer);
  textTimer = setTimeout(() => {
    localStorage.setItem(KEY_TEXT, editor.value);
    showSaved();
  }, 600);
});

let savedTimer = null;
function showSaved() {
  savedTip.classList.add('show');
  clearTimeout(savedTimer);
  savedTimer = setTimeout(() => {
    savedTip.classList.remove('show');
  }, 1500);
}

/* 换背景 */
document.getElementById('btnUpload').addEventListener('click', () => {
  fileInput.click();
});

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    const dataUrl = e.target.result;
    bg.style.backgroundImage = `url(${dataUrl})`;
    // 存入大容量数据库，不再弹提示
    saveBgToDB(dataUrl);
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
});

/* 清除背景 */
document.getElementById('btnClearBg').addEventListener('click', () => {
  bg.style.backgroundImage = '';
  clearBgFromDB();
});

fontBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    setFont(btn.dataset.font);
  });
});
</script>

</body>
</html>
