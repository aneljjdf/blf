<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>0.07%</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ffffff'/%3E%3Cline x1='20' y1='50' x2='80' y2='50' stroke='%23000000' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">

<style>
  :root {
    /* 字体 */
    --fs-micro: 10px;
    --fs-meta: 11px;
    --fs-body: 14px;
    --fs-title: 26px;

    /* 颜色 */
    --c-black: #000;
    --c-ink: #1a1a1a;
    --c-body: #222;
    --c-grey: #8a8a8a;
    --c-grey-strong: #666;
    --c-line: #e5e5e5;

    /* 动效 */
    --dur-fast: 180ms;
    --dur-base: 320ms;
    --ease: cubic-bezier(.2, 0, 0, 1);
    --ease-meta: cubic-bezier(.4, 0, .2, 1);
    --slide-dist: 28px;

    /* 布局 */
    --header-h: 64px;
    --meta-h: 62px;

    /* 手势与滚轮 */
    --swipe-x: 40px;
    --swipe-y: 80px;
    --swipe-max-ms: 600;
    --wheel-threshold: 20;
    --wheel-cooldown: 350ms; /* 桌面端稍微灵敏一点 */
  }

  html { scroll-behavior: auto; overflow-anchor: none; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

  body {
    background: #fff; color: var(--c-black);
    font-family: "Inter", "Helvetica", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overscroll-behavior: none;
  }

  .tag {
    font-size: var(--fs-micro);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--c-grey);
  }

  /* 顶栏 */
  .site-header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: #fff;
    display: flex; align-items: center;
    height: var(--header-h);
    padding: 0 40px;
    border-bottom: 1px solid transparent;
  }
  .header-left {
    font-size: 14px; font-weight: 500; letter-spacing: 0.02em; cursor: pointer;
    line-height: 1;
  }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .header-right .tag { color: var(--c-grey-strong); }
  .header-dot { font-size: var(--fs-micro); color: var(--c-line); }

  .nav-links { display: flex; align-items: center; gap: 32px; margin-left: 40px; }
  .nav-links span {
    font-size: var(--fs-micro); font-weight: 500; letter-spacing: 0.12em; color: var(--c-grey);
    text-transform: uppercase; cursor: pointer;
    transition: color var(--dur-fast) var(--ease);
    padding: 4px 0;
  }
  .nav-links span:hover { color: var(--c-grey-strong); }
  .nav-links span.active { color: var(--c-black); }

  /* 页面切换 */
  .page-section { display: none; }
  .page-section.active { display: block; }

  /* ABOUT */
  #page-about { padding-top: var(--header-h); }
  .about-container {
    max-width: 560px;
    margin: 0 auto;
    padding: 20vh 8vw 30vh;
  }
  .about-title {
    font-size: var(--fs-title);
    font-weight: 300;
    letter-spacing: 0.06em;
    line-height: 1.6;
    margin-bottom: 80px;
    text-align: center;
  }
  .about-text-block { margin-bottom: 48px; }
  .about-text-block p {
    font-size: var(--fs-body);
    font-weight: 300;
    letter-spacing: 0.02em;
    line-height: 1.9;
    color: var(--c-body);
  }

  /* INDEX */
  #page-gallery { padding-top: var(--header-h); }
  .index-block { 
    max-width: 1000px; /* 桌面端拉宽，更大气 */
    margin: 0 auto; 
    padding: 12vh 6vw 20vh; 
  }
  .index-title { margin-bottom: 32px; }
  
  .index-grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); 
    gap: 6px; 
  }
  .index-grid a {
    display: flex; align-items: center; justify-content: center;
    height: 40px;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--c-grey);
    text-decoration: none;
    font-variant-numeric: tabular-nums;
    border: 1px solid transparent;
    border-radius: 2px;
    transition: color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
  }
  .index-grid a:hover { color: var(--c-black); border-color: var(--c-line); }
  .index-grid a.visited { color: var(--c-ink); }
  .index-grid a:focus-visible { border-color: var(--c-ink); color: var(--c-black); }

  /* 单条视图 */
  .viewer-overlay {
    position: fixed; inset: 0; background: #fff; z-index: 200;
    display: none; flex-direction: column;
    overflow: hidden;
  }
  .viewer-overlay.active { display: flex; }

  .viewer-close {
    position: fixed;
    top: 24px; right: 32px;
    z-index: 30;
    background: none; border: none;
    font-family: inherit;
    font-size: var(--fs-micro);
    letter-spacing: 0.2em;
    color: var(--c-grey-strong);
    text-transform: uppercase;
    cursor: pointer;
    padding: 8px 4px;
    transition: color var(--dur-fast) var(--ease);
  }
  .viewer-close:hover { color: var(--c-black); }
  .viewer-close:focus-visible { color: var(--c-black); }

  .viewer-content {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(var(--header-h) + 30px) 8vw 60px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }

  .specimen {
    text-align: center;
    display: flex; flex-direction: column; align-items: center;
    width: 100%;
    max-width: 800px; /* 桌面端大幅放宽，让图片撑满 */
    padding: 0 0 10px;
  }

  .specimen-figure {
    width: 100%;
    display: flex; align-items: center; justify-content: center;
    min-height: 300px;
    max-height: 78vh; /* 最大化图片高度 */
  }
  
  .specimen img {
    max-width: 100%;
    max-height: 78vh;
    width: auto; height: auto;
    object-fit: contain;
    display: block;
    margin: 0 auto;
    user-select: none;
    -webkit-user-drag: none;
    opacity: 1;
    transition: opacity var(--dur-fast) var(--ease);
  }
  .specimen img.is-loading { opacity: 0; }

  .specimen.boundary { animation: boundary-nudge var(--dur-base) var(--ease); }
  @keyframes boundary-nudge {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  .specimen-meta {
    margin-top: 24px;
    width: 100%;
    max-width: 400px;
    height: var(--meta-h);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    position: relative;
  }
  .specimen-meta-inner {
    text-align: center;
    display: flex; flex-direction: column; align-items: center;
    gap: 6px;
    transition: opacity var(--dur-base) var(--ease-meta),
                transform var(--dur-base) var(--ease-meta);
    will-change: opacity, transform;
  }
  .specimen-meta.is-switching .specimen-meta-inner {
    opacity: 0;
    transform: translateY(var(--slide-out, calc(var(--slide-dist) * -1)));
  }

  .specimen-brand {
    font-size: 12px; /* 桌面端品牌名稍大 */
    font-weight: 500;
    letter-spacing: 0.15em;
    color: var(--c-ink);
    text-transform: uppercase;
    line-height: 1.6;
  }
  .specimen-season {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.08em;
    color: var(--c-grey-strong);
    line-height: 1.6;
  }

  /* 移动端优化 */
  @media (max-width: 768px) {
    .site-header { height: auto; padding: 14px 20px; flex-wrap: wrap; gap: 10px; }
    .nav-links { margin-left: 0; gap: 22px; }

    .about-container { padding: 16vh 6vw 20vh; }
    .about-title { font-size: 22px; margin-bottom: 48px; }
    .about-text-block p { font-size: 14px; letter-spacing: 0.01em; }

    .index-block { padding: 8vh 6vw 15vh; }
    .index-grid { 
      grid-template-columns: repeat(4, 1fr); 
      gap: 8px; 
    }
    .index-grid a {
      height: 44px;
      font-size: 13px;
    }

    .viewer-content { 
      padding: 72px 4vw 40px;
    }
    .specimen { max-width: 100%; }
    .specimen-figure { max-height: 65vh; }
    .specimen img { max-height: 65vh; }
    
    .specimen-meta { margin-top: 16px; }
    .specimen-brand { font-size: 12px; }
    .specimen-season { font-size: 11px; }
    
    .viewer-close { top: 18px; right: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 1ms !important; animation-duration: 1ms !important; }
  }
</style>
</head>
<body>

  <header class="site-header" id="siteHeader">
    <div class="header-left" id="brandHome" role="button" tabindex="0">0.07%</div>
    <nav class="nav-links">
      <span id="nav-about" class="active" role="button" tabindex="0" data-page="about">ABOUT</span>
      <span id="nav-gallery" role="button" tabindex="0" data-page="gallery">COLLECTION</span>
    </nav>
    <div class="header-right">
      <span class="tag">ARCHIVE</span>
      <span class="header-dot">·</span>
      <span class="tag">2026</span>
    </div>
  </header>

  <section id="page-about" class="page-section active">
    <div class="about-container">
      <h1 class="about-title">为这个领域，划一条金线。</h1>
      <div class="about-text-block">
        <p>标准不散落于众口。金线不看谁声高，不看多少人附和。不需要批准，无法修改，它自身成立。</p>
      </div>
      <div class="about-text-block">
        <p>金线不是被发明，而是被发现。它本来就在。此刻，它第一次在场。</p>
      </div>
    </div>
  </section>

  <section id="page-gallery" class="page-section">
    <div class="index-block">
      <div class="index-title tag">INDEX</div>
      <div class="index-grid" id="indexGrid"></div>
    </div>
  </section>

  <div class="viewer-overlay" id="viewerOverlay" role="dialog" aria-modal="true" aria-label="作品查看">
    <button class="viewer-close" id="backIndex" type="button">CLOSE</button>
    <div class="viewer-content" id="viewerContent"></div>
  </div>

<script>
/* ============================================================
   数据
   ============================================================ */
const brandsData = [
  { folder: 'avavav', name: 'AVAVAV', images: [{ file: '01.webp', season: 'FALL 2024 READY-TO-WEAR' }] },
  { folder: 'bed-j-w-ford', name: 'BED J.W. FORD', images: [{ file: '01.webp', season: 'FALL 2024 MENSWEAR' }] },
  { folder: 'botter', name: 'BOTTER', images: [{ file: '01.webp', season: 'FALL 2024 MENSWEAR' }] },
  { folder: 'burc-akyol', name: 'BURC AKYOL', images: [{ file: '01.webp', season: 'SPRING 2026 READY-TO-WEAR', note: '肩宽缩小点' }] },
  { folder: 'charles-jeffrey-loverboy', name: 'CHARLES JEFFREY LOVERBOY', images: [
    { file: '01.webp', season: 'SPRING 2025 MENSWEAR' },
    { file: '02.webp', season: 'FALL 2023 MENSWEAR' }
  ]},
  { folder: 'danielle-frankel', name: 'DANIELLE FRANKEL', images: [{ file: '01.webp', season: 'FALL 2025 READY-TO-WEAR' }] },
  { folder: 'dries-van-noten', name: 'DRIES VAN NOTEN', images: [{ file: '01.webp', season: 'FALL 2021 MENSWEAR' }] },
  { folder: 'eenk', name: 'EENK', images: [{ file: '01.webp', season: 'SPRING 2024 READY-TO-WEAR' }] },
  { folder: 'feng-chen-wang', name: 'FENG CHEN WANG', images: [{ file: '01.webp', season: 'SPRING 2025 MENSWEAR' }] },
  { folder: 'freya-dalsjo', name: 'FREYA DALSJØ', images: [
    { file: '01.webp', season: 'COPENHAGEN SPRING 2026' },
    { file: '02.webp', season: 'COPENHAGEN FALL 2026' }
  ]},
  { folder: 'harris-reed', name: 'HARRIS REED', images: [{ file: '01.webp', season: 'FALL 2022 READY-TO-WEAR', note: '头顶上的改掉' }] },
  { folder: 'loewe', name: 'LOEWE', images: [{ file: '01.webp', season: 'FALL 2024 READY-TO-WEAR', note: '仅上衣' }] },
  { folder: 'maison-mihara-yasuhiro', name: 'MAISON MIHARA YASUHIRO', images: [{ file: '01.webp', season: 'SPRING 2027 MENSWEAR', note: '去掉项链' }] },
  { folder: 'matieres-fecales', name: 'MATIÈRES FÉCALES', images: [{ file: '01.webp', season: 'SPRING 2027 READY-TO-WEAR' }] },
  { folder: 'palomo-spain', name: 'PALOMO SPAIN', images: [
    { file: '01.webp', season: 'FALL 2023 READY-TO-WEAR' },
    { file: '02.webp', season: 'FALL 2023 READY-TO-WEAR' },
    { file: '03.webp', season: 'FALL 2023 READY-TO-WEAR', note: '下半身' }
  ]},
  { folder: 'robert-wun', name: 'ROBERT WUN', images: [
    { file: '01.webp', season: 'SPRING 2026 COUTURE' },
    { file: '02.webp', season: 'SPRING 2026 COUTURE' },
    { file: '03.webp', season: 'FALL 2024 COUTURE' },
    { file: '04.webp', season: 'SPRING 2024 COUTURE' }
  ]},
  { folder: 'saint-laurent', name: 'SAINT LAURENT', images: [{ file: '01.webp', season: 'SPRING 2018 READY-TO-WEAR' }] },
  { folder: 'versace', name: 'VERSACE', images: [
    { file: '01.webp', season: 'SPRING 2023 READY-TO-WEAR' },
    { file: '02.webp', season: 'PRE-FALL 2024 MENSWEAR' },
    { file: '03.webp', season: 'PRE-FALL 2024 MENSWEAR' }
  ]},
  { folder: 'wooyoungmi', name: 'WOOYOUNGMI', images: [
    { file: '01.webp', season: 'FALL 2018 MENSWEAR' },
    { file: '02.webp', season: 'FALL 2018 MENSWEAR', note: '内搭换掉' }
  ]}
];

const allItems = [];
brandsData.forEach(brand => {
  brand.images.forEach(img => {
    allItems.push({
      src: `images/${brand.folder}/${img.file}`,
      brand: brand.name,
      season: img.season,
      note: img.note || ''
    });
  });
});

/* 状态 */
let currentIndex = -1;
let isSwitching = false;
let boundaryTimer = 0;
const visited = new Set();
const preloaded = new Set();

const indexGrid = document.getElementById('indexGrid');
const viewerOverlay = document.getElementById('viewerOverlay');
const viewerContent = document.getElementById('viewerContent');

function padZero(n, w) { return n.toString().padStart(w, '0'); }

function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function preload(i) {
  if (i < 0 || i >= allItems.length || preloaded.has(i)) return;
  preloaded.add(i);
  const img = new Image();
  img.src = allItems[i].src;
}

function switchPage(pageId) {
  closeViewer();
  window.scrollTo(0, 0);
  document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
  document.getElementById('page-' + pageId).classList.add('active');
  document.querySelectorAll('.nav-links span').forEach(el => el.classList.remove('active'));
  const nav = document.getElementById('nav-' + pageId);
  if (nav) nav.classList.add('active');
}

function renderIndex() {
  const frag = document.createDocumentFragment();
  allItems.forEach((_, i) => {
    const a = document.createElement('a');
    a.href = 'javascript:void(0)';
    a.textContent = padZero(i + 1, 3);
    a.title = `${allItems[i].brand} · ${allItems[i].season}`;
    a.dataset.index = i;
    if (visited.has(i)) a.classList.add('visited');
    frag.appendChild(a);
  });
  indexGrid.innerHTML = '';
  indexGrid.appendChild(frag);
}

function markVisited(i) {
  visited.add(i);
  const el = indexGrid.querySelector(`a[data-index="${i}"]`);
  if (el) el.classList.add('visited');
}

function buildMetaHTML(item) {
  return `
    <div class="specimen-brand">${escapeHTML(item.brand)}</div>
    <div class="specimen-season">${escapeHTML(item.season)}</div>
  `;
}

function renderViewer(i) {
  const item = allItems[i];
  viewerContent.innerHTML = `
    <div class="specimen" id="specimenEl">
      <div class="specimen-figure">
        <img src="${item.src}" alt="${escapeHTML(item.brand)} ${escapeHTML(item.season)}" draggable="false" class="is-loading">
      </div>
      <div class="specimen-meta" id="specimenMeta">
        <div class="specimen-meta-inner" id="specimenMetaInner">
          ${buildMetaHTML(item)}
        </div>
      </div>
    </div>
  `;
  const img = viewerContent.querySelector('.specimen img');
  const onLoad = () => img.classList.remove('is-loading');
  if (img.complete) onLoad();
  else img.addEventListener('load', onLoad, { once: true });
  img.addEventListener('error', onLoad, { once: true });
}

function openViewer(i) {
  if (i < 0 || i >= allItems.length) return;
  currentIndex = i;
  markVisited(i);
  renderViewer(i);
  viewerOverlay.classList.add('active');
  document.body.style.overflow = 'hidden';
  viewerContent.scrollTop = 0;
  preload(i - 1); preload(i + 1);
}

let pendingTarget = null;

function switchTo(i, direction) {
  if (i < 0 || i >= allItems.length) { nudgeBoundary(); return; }
  if (i === currentIndex) return;

  if (isSwitching) { pendingTarget = { i, direction }; return; }

  const specimenEl = document.getElementById('specimenEl');
  const metaEl = document.getElementById('specimenMeta');
  const metaInner = document.getElementById('specimenMetaInner');
  const imgEl = specimenEl ? specimenEl.querySelector('img') : null;

  if (!specimenEl || !metaEl || !metaInner || !imgEl) {
    currentIndex = i;
    markVisited(i);
    renderViewer(i);
    viewerContent.scrollTop = 0;
    return;
  }

  isSwitching = true;
  const item = allItems[i];
  const isNext = direction === 'next';

  const outY = isNext ? 'calc(var(--slide-dist) * -1)' : 'var(--slide-dist)';
  const inY  = isNext ? 'var(--slide-dist)' : 'calc(var(--slide-dist) * -1)';

  metaEl.style.setProperty('--slide-out', outY);
  metaEl.classList.add('is-switching');

  const durMs = getComputedStyle(metaInner).transitionDuration.split(',')[0].trim();
  const wait = parseFloat(durMs) * (durMs.includes('ms') ? 1 : 1000) || 320;

  setTimeout(() => {
    imgEl.classList.add('is-loading');
    imgEl.src = item.src;
    
    const reveal = () => {
      imgEl.classList.remove('is-loading');
      imgEl.removeEventListener('load', reveal);
      imgEl.removeEventListener('error', reveal);
    };
    if (imgEl.complete) reveal();
    else {
      imgEl.addEventListener('load', reveal, { once: true });
      imgEl.addEventListener('error', reveal, { once: true });
    }

    metaInner.style.transition = 'none';
    metaInner.style.transform = `translateY(${inY})`;
    metaInner.style.opacity = '0';
    metaInner.innerHTML = buildMetaHTML(item);
    void metaInner.offsetWidth;
    
    requestAnimationFrame(() => {
      metaInner.style.transition = '';
      metaInner.style.transform = '';
      metaInner.style.opacity = '';
      metaEl.classList.remove('is-switching');
      
      const end = () => {
        isSwitching = false;
        if (pendingTarget) {
          const p = pendingTarget; pendingTarget = null;
          switchTo(p.i, p.direction);
        }
      };
      
      metaInner.addEventListener('transitionend', function te(e) {
        if (e.propertyName === 'opacity' || e.propertyName === 'transform') {
          metaInner.removeEventListener('transitionend', te);
          end();
        }
      });
      setTimeout(() => { if (isSwitching) end(); }, 600);
    });
  }, wait);

  currentIndex = i;
  markVisited(i);
  viewerContent.scrollTop = 0;
  preload(i - 1); preload(i + 1);
}

function nudgeBoundary() {
  const specimenEl = document.getElementById('specimenEl');
  if (!specimenEl) return;
  clearTimeout(boundaryTimer);
  specimenEl.classList.remove('boundary');
  void specimenEl.offsetWidth;
  specimenEl.classList.add('boundary');
  boundaryTimer = setTimeout(() => specimenEl.classList.remove('boundary'), 400);
}

function closeViewer() {
  viewerOverlay.classList.remove('active');
  document.body.style.overflow = '';
  isSwitching = false;
  pendingTarget = null;
  currentIndex = -1;
}

function goPrev() { if (currentIndex <= 0) { nudgeBoundary(); return; } switchTo(currentIndex - 1, 'prev'); }
function goNext() { if (currentIndex >= allItems.length - 1) { nudgeBoundary(); return; } switchTo(currentIndex + 1, 'next'); }

document.addEventListener('click', e => {
  const a = e.target.closest('.index-grid a');
  if (a) {
    e.preventDefault();
    openViewer(parseInt(a.dataset.index, 10));
    return;
  }
  if (e.target.closest('#backIndex')) { e.preventDefault(); closeViewer(); return; }
  const nav = e.target.closest('[data-page]');
  if (nav) { switchPage(nav.dataset.page); return; }
  if (e.target.closest('#brandHome')) { switchPage('about'); return; }
});

document.addEventListener('keydown', e => {
  const nav = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.page;
  if (nav && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault(); switchPage(nav); return;
  }
  if (document.activeElement && document.activeElement.id === 'brandHome' && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault(); switchPage('about'); return;
  }

  if (!viewerOverlay.classList.contains('active')) return;

  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); goPrev(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); goNext(); }
  else if (e.key === 'Escape') { closeViewer(); }
});

let wheelCooldown = false;
document.addEventListener('wheel', e => {
  if (!viewerOverlay.classList.contains('active')) return;
  if (wheelCooldown) return;
  const threshold = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--wheel-threshold')) || 20;
  if (Math.abs(e.deltaY) < threshold) return;
  wheelCooldown = true;
  if (e.deltaY > 0) goNext(); else goPrev();
  const cooldown = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--wheel-cooldown')) || 350;
  setTimeout(() => { wheelCooldown = false; }, cooldown);
}, { passive: true });

let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
let touchActive = false;

viewerOverlay.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  if (e.target.closest('#backIndex')) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartTime = Date.now();
  touchActive = true;
}, { passive: true });

viewerOverlay.addEventListener('touchend', e => {
  if (!touchActive) return;
  touchActive = false;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const dt = Date.now() - touchStartTime;
  const absX = Math.abs(dx);
  const absY = Math.abs(dy);

  const root = getComputedStyle(document.documentElement);
  const maxMs = parseFloat(root.getPropertyValue('--swipe-max-ms')) || 600;
  const sx = parseFloat(root.getPropertyValue('--swipe-x')) || 40;
  const sy = parseFloat(root.getPropertyValue('--swipe-y')) || 80;

  if (dt > maxMs) return;

  if (absX > absY && absX > sx) {
    if (dx < 0) goNext(); else goPrev();
    return;
  }
  if (absY > absX && absY > sy) {
    if (dy < 0) goNext(); else goPrev();
  }
}, { passive: true });

renderIndex();
</script>
